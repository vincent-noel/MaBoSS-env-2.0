{% set name = "cMaBoSS" %}
{% set version = "1.0.0b31" %}

package:
  name: '{{ name|lower }}'
  version: '{{ version }}'

source:
  path: ../../..


build:
  {% if CUSTOM_BUILD_NUMBER is defined %}
  number: {{ CUSTOM_BUILD_NUMBER }}
  {% else %}
  number: 0
  {% endif %}
  script_env:
    - SBML_COMPAT
    - SEDML_COMPAT

requirements:
  build:
    - setuptools
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - flex  # [not win]
    - bison  # [not win]
    - make  # [not win]
    - cmake
    - ninja

  host: 
    - python {{ python }}
    - pip
    - scikit-build-core
    - {{ pin_compatible('numpy', min_pin='x.x', max_pin='x') }}
    - {{ LIBSBML_PACKAGE }}
  
  run: 
    - python {{ python }}
    - {{ pin_compatible('numpy', min_pin='x.x', max_pin='x') }}
    - {{ LIBSBML_PACKAGE }}
test:
  requires:
    - python {{ python }}
    - {{ pin_compatible('numpy', min_pin='x.x', max_pin='x') }}
    - pandas

about:
  home:  https://maboss.curie.fr
